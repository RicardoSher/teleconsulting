<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 88" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="emblemBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#020617"/>
        </linearGradient>

        <linearGradient id="aeroArcDark1" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#0ea5e9"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>

        <linearGradient id="aeroArcDark2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0369a1"/>
            <stop offset="70%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#bae6fd"/>
        </linearGradient>

        <linearGradient id="wingGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="#f0f9ff"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>

        <linearGradient id="wingShadowDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0c4a6e"/>
        </linearGradient>

        <radialGradient id="emeraldPulseDark" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="60%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
        </radialGradient>

        <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="wingShadowDarkFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- ── EMBLEM (Left: 80x80 box centered in 88h) ─────────────── -->
    <g transform="translate(6, 4)">
        <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#emblemBgDark)"/>
        <rect x="0" y="0" width="80" height="80" rx="20" stroke="url(#aeroArcDark1)" stroke-width="1.75"/>

        <!-- Concentric RF Spectrum Waves -->
        <path d="M 16 57 A 28 28 0 0 1 64 57" stroke="url(#aeroArcDark1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.6"/>
        <path d="M 22 53 A 22 22 0 0 1 58 53" stroke="url(#aeroArcDark2)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
        <path d="M 29 49 A 14 14 0 0 1 51 49" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" filter="url(#glowDark)"/>

        <!-- Delta Aircraft Wing -->
        <g filter="url(#wingShadowDarkFilter)">
            <path d="M 40 16 L 24 48 L 37 43 L 40 36 Z" fill="url(#wingShadowDark)"/>
            <path d="M 40 16 L 40 36 L 43 43 L 56 48 Z" fill="url(#wingGradientDark)"/>
            <path d="M 40 15 L 41.5 37 L 40 40 L 38.5 37 Z" fill="#ffffff"/>
        </g>

        <!-- Beacon -->
        <circle cx="40" cy="50" r="5" fill="url(#emeraldPulseDark)" filter="url(#glowDark)"/>
        <circle cx="40" cy="50" r="2.5" fill="#10b981"/>
        <circle cx="40" cy="50" r="1" fill="#ffffff"/>

        <!-- Orbit -->
        <ellipse cx="40" cy="42" rx="30" ry="10" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="2 4" transform="rotate(-28 40 42)" opacity="0.75"/>
        <circle cx="60" cy="32" r="2" fill="#38bdf8" filter="url(#glowDark)"/>
    </g>

    <!-- ── BRAND TYPOGRAPHY (Right - White & Cyan on Dark) ───────── -->
    <g transform="translate(104, 0)">
        <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5" fill="#ffffff">
            Aero<tspan fill="#38bdf8">TeleConsult</tspan>
        </text>

        <rect x="238" y="21" width="56" height="18" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
        <text x="266" y="33.5" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
            KENYA
        </text>

        <text x="0" y="56" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#38bdf8" letter-spacing="1.8">
            SPECTRUM &amp; AVIATION SECRETARIAT
        </text>

        <text x="0" y="70" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="8.5" fill="#94a3b8" letter-spacing="0.5">
            CA &amp; KCAA REGULATORY ENGINEERING COMPLIANCE
        </text>
    </g>
</svg>
